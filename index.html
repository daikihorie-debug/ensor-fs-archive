<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>リリース台帳 — 公開レポート一覧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f8fa;
    --paper-deep: #eaeff3;
    --ink: #1c2b38;
    --ink-soft: #5c7182;
    --line: #d9e2e8;
    --indigo-deep: #1e3a5c;
    --indigo: #3f6f9e;
    --indigo-soft: #8fb1cd;
    --slate: #4b7583;
    --mincho: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --gothic: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    --mono: "IBM Plex Mono", "SF Mono", Menlo, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--gothic);
    font-size: 15px;
    line-height: 1.7;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* ---- decorative ink-wash background (non-interactive, wide viewports only) ---- */
  .ink-deco {
    position: fixed;
    top: 0;
    right: 0;
    width: clamp(220px, 24vw, 420px);
    aspect-ratio: 736 / 1308;
    z-index: 0;
    pointer-events: none;
    opacity: .5;
    background-image: url('assets/bg-ink-mountain.png');
    background-size: contain;
    background-position: top right;
    background-repeat: no-repeat;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 38%);
    mask-image: linear-gradient(90deg, transparent 0%, #000 38%);
  }
  @media (max-width: 1100px) {
    .ink-deco { display: none; }
  }

  .wrap { max-width: 900px; margin: 0 auto; padding: 48px 24px 80px; position: relative; z-index: 1; }

  /* ---- masthead ---- */
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .masthead h1 {
    font-family: var(--mincho);
    font-weight: 800;
    font-size: clamp(30px, 5.2vw, 44px);
    letter-spacing: .1em;
    line-height: 1.25;
  }
  .masthead h1 .accent {
    background: linear-gradient(120deg, var(--indigo-deep), var(--indigo));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .masthead .sub {
    margin-top: 8px;
    color: var(--ink-soft);
    font-size: 13px;
    letter-spacing: .06em;
  }
  .stats { display: flex; gap: 12px; padding-bottom: 4px; flex-wrap: wrap; }
  .stat {
    text-align: left;
    background: rgba(255,255,255,.82);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 18px 9px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    position: relative;
    overflow: hidden;
    min-width: 92px;
  }
  .stat::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--indigo-deep), var(--indigo-soft));
  }
  .stat .num {
    font-family: var(--mono);
    font-weight: 500;
    font-size: 24px;
    line-height: 1.15;
    font-variant-numeric: tabular-nums;
    color: var(--indigo-deep);
  }
  .stat .label { font-size: 10.5px; color: var(--ink-soft); letter-spacing: .1em; margin-top: 2px; }

  .rule {
    margin: 26px 0 22px;
    border: 0;
    height: 1px;
    background: linear-gradient(90deg, var(--indigo) 0%, var(--indigo-soft) 45%, transparent 100%);
    opacity: .6;
  }

  /* ---- controls ---- */
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 30px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    font-family: var(--gothic);
    font-size: 13px;
    letter-spacing: .02em;
    padding: 7px 17px;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    background: rgba(255,255,255,.6);
    color: var(--ink);
    cursor: pointer;
    transition: border-color .15s, color .15s, background .2s;
  }
  .chip:hover { border-color: var(--indigo); color: var(--indigo-deep); }
  .chip[aria-pressed="true"] {
    background: var(--indigo-deep);
    border-color: transparent;
    color: #fff;
  }
  .chip:focus-visible, .toggle input:focus-visible + .knob, .row-copy:focus-visible, .search input:focus-visible {
    outline: 2px solid var(--indigo);
    outline-offset: 2px;
  }
  .search { flex: 1; min-width: 200px; }
  .search input {
    width: 100%;
    font-family: var(--gothic);
    font-size: 14px;
    padding: 9px 15px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: rgba(255,255,255,.6);
    color: var(--ink);
  }
  .search input::placeholder { color: #9aacb8; }
  .toggle {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12.5px; color: var(--ink-soft); cursor: pointer; user-select: none;
    letter-spacing: .02em;
    background: rgba(255,255,255,.75);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 14px;
  }
  .toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .toggle .knob {
    width: 34px; height: 19px; border-radius: 999px;
    border: 1.5px solid var(--ink-soft);
    position: relative; transition: background .15s, border-color .15s;
    flex: none;
  }
  .toggle .knob::after {
    content: ""; position: absolute; top: 2px; left: 2.5px;
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--ink-soft); transition: transform .15s, background .15s;
  }
  .toggle input:checked + .knob { background: var(--indigo); border-color: var(--indigo); }
  .toggle input:checked + .knob::after { transform: translateX(14px); background: #fff; }

  /* ---- month groups ---- */
  .month {
    display: flex; align-items: baseline; gap: 14px;
    margin: 34px 0 4px;
  }
  .month h2 {
    font-family: var(--mono);
    font-weight: 500;
    font-size: 13px;
    letter-spacing: .1em;
    white-space: nowrap;
    color: var(--indigo-deep);
  }
  .month .count { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); white-space: nowrap; }
  .month::after { content: ""; flex: 1; height: 1px; background: var(--line); transform: translateY(-2px); }

  /* ---- rows ---- */
  .row {
    display: grid;
    grid-template-columns: 84px 76px 1fr auto;
    gap: 14px;
    align-items: start;
    padding: 16px 16px 15px;
    margin-bottom: 10px;
    background: rgba(255,255,255,.88);
    border: 1px solid var(--line);
    border-radius: 12px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: border-color .15s, box-shadow .15s;
    position: relative;
  }
  .row:hover {
    border-color: var(--indigo);
    box-shadow: 0 6px 20px -12px rgba(30,58,92,.28);
  }
  .row-date {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-soft);
    padding-top: 4px;
    letter-spacing: .01em;
    font-variant-numeric: tabular-nums;
  }
  .seal {
    font-family: var(--gothic);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: .02em;
    text-align: center;
    padding: 5px 8px;
    border-radius: 999px;
    line-height: 1.3;
    color: #fff;
    white-space: nowrap;
  }
  .seal.ensor { background: linear-gradient(120deg, var(--indigo-deep), #14293f); }
  .seal.yomu  { background: linear-gradient(120deg, var(--indigo), var(--indigo-deep)); }
  .seal.other { background: linear-gradient(120deg, var(--slate), #365a66); }
  .row-main a.title {
    font-family: var(--gothic);
    font-weight: 700;
    font-size: 17px;
    line-height: 1.5;
    color: var(--ink);
    text-decoration: none;
    background-image: linear-gradient(90deg, var(--indigo-deep), var(--indigo-soft));
    background-position: 0 100%;
    background-repeat: no-repeat;
    background-size: 0% 2px;
    transition: background-size .2s, color .15s;
  }
  .row-main a.title:hover { background-size: 100% 2px; color: var(--indigo-deep); }
  .row-main a.title::after { content: " ↗"; font-size: 12px; color: var(--indigo); font-family: var(--gothic); }
  .row-meta {
    margin-top: 4px;
    display: flex; flex-wrap: wrap; gap: 4px 14px;
    font-size: 12px; color: var(--ink-soft);
  }
  .row-meta .fname { font-family: var(--mono); font-size: 11.5px; }
  .old-badge {
    display: inline-block;
    font-size: 10.5px;
    padding: 1px 9px;
    border-radius: 999px;
    background: var(--paper-deep);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    margin-left: 8px;
    vertical-align: 2px;
    font-family: var(--gothic);
    font-weight: 500;
  }
  .row.superseded { opacity: .6; }
  .row.superseded a.title { font-weight: 500; }
  .row-copy {
    font-family: var(--gothic);
    font-size: 12px;
    letter-spacing: .02em;
    padding: 7px 14px;
    margin-top: 2px;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    white-space: nowrap;
    transition: border-color .15s, color .15s;
  }
  .row-copy:hover { border-color: var(--indigo); color: var(--indigo-deep); }
  .row-copy.done { border-color: var(--indigo); color: var(--indigo-deep); }

  /* ---- empty / footer ---- */
  .empty {
    text-align: center;
    padding: 70px 0 50px;
    color: var(--ink-soft);
    font-family: var(--mincho);
    font-size: 15px;
    letter-spacing: .1em;
  }
  footer {
    margin-top: 56px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.9;
  }
  footer code {
    font-family: var(--mono);
    font-size: 11px;
    background: var(--paper-deep);
    padding: 1px 6px;
    border-radius: 4px;
  }
  footer .dot { color: var(--indigo); font-weight: 700; }

  @media (max-width: 620px) {
    .wrap { padding: 32px 16px 60px; }
    .stats { gap: 10px; }
    .stat { min-width: 78px; padding: 8px 13px 7px; }
    .row { grid-template-columns: 1fr auto; grid-template-rows: auto auto; gap: 6px 12px; }
    .row-date { grid-row: 1; padding-top: 0; }
    .seal { grid-row: 1; grid-column: 2; justify-self: end; margin-top: 0; }
    .row-main { grid-column: 1 / -1; }
    .row-copy { grid-column: 1 / -1; justify-self: start; }
  }
</style>
</head>
<body>
<div class="ink-deco" aria-hidden="true"></div>

<div class="wrap">
  <header>
    <div class="masthead">
      <h1>リリース<span class="accent">台帳</span></h1>
      <p class="sub">n8n webhook 経由で公開したレポートの記録簿</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <hr class="rule">

  <div class="controls">
    <div class="chips" id="chips" role="group" aria-label="プロジェクト絞り込み"></div>
    <div class="search">
      <input type="search" id="q" placeholder="タイトル・ファイル名・メモで検索" aria-label="検索">
    </div>
    <label class="toggle">
      <input type="checkbox" id="showOld">
      <span class="knob" aria-hidden="true"></span>
      旧版も表示
    </label>
  </div>

  <main id="list" aria-live="polite"></main>

  <footer>
    <p><span class="dot">●</span> 各URLは Google ログイン必須（本人のみ閲覧可）。第三者共有にはバケット設定の変更が必要。</p>
    <p><span class="dot">●</span> 新しいレポートを公開したら <code>~/projects/reports-hub/registry.js</code> の先頭に1エントリ追記するだけで、この台帳に反映される。</p>
  </footer>
</div>

<script src="registry.js"></script>
<script>
(function () {
  var reports = (window.REPORTS || []).slice().sort(function (a, b) {
    if (a.date !== b.date) return a.date < b.date ? 1 : -1;
    return a.id < b.id ? 1 : -1;
  });

  var state = { project: "すべて", q: "", showOld: false };

  var $stats = document.getElementById("stats");
  var $chips = document.getElementById("chips");
  var $list  = document.getElementById("list");
  var $q     = document.getElementById("q");
  var $old   = document.getElementById("showOld");

  /* ---- stats ---- */
  function renderStats() {
    var latest = reports.filter(function (r) { return !r.supersededBy; });
    var projects = {};
    reports.forEach(function (r) { projects[r.project] = true; });
    var last = reports.length ? reports[0].date : "—";
    $stats.innerHTML =
      stat(latest.length, "現行リリース") +
      stat(Object.keys(projects).length, "プロジェクト") +
      stat(last, "最終リリース");
    function stat(num, label) {
      return '<div class="stat"><div class="num">' + esc(String(num)) + '</div><div class="label">' + label + "</div></div>";
    }
  }

  /* ---- chips ---- */
  function renderChips() {
    var names = ["すべて"];
    reports.forEach(function (r) {
      if (names.indexOf(r.project) === -1) names.push(r.project);
    });
    $chips.innerHTML = names.map(function (n) {
      return '<button type="button" class="chip" aria-pressed="' + (state.project === n) + '" data-p="' + esc(n) + '">' + esc(n) + "</button>";
    }).join("");
  }
  $chips.addEventListener("click", function (e) {
    var btn = e.target.closest(".chip");
    if (!btn) return;
    state.project = btn.getAttribute("data-p");
    renderChips();
    renderList();
  });

  /* ---- list ---- */
  function sealClass(p) {
    if (p === "ENSOR") return "ensor";
    if (p === "Yomu") return "yomu";
    return "other";
  }
  function matches(r) {
    if (!state.showOld && r.supersededBy) return false;
    if (state.project !== "すべて" && r.project !== state.project) return false;
    if (state.q) {
      var hay = (r.title + " " + (r.filename || "") + " " + (r.note || "") + " " + r.project).toLowerCase();
      if (hay.indexOf(state.q) === -1) return false;
    }
    return true;
  }
  function monthLabel(date) {
    var m = date.split("-");
    return m[0] + "年" + parseInt(m[1], 10) + "月";
  }
  function renderList() {
    var visible = reports.filter(matches);
    if (!visible.length) {
      $list.innerHTML = '<p class="empty">該当するリリースはありません</p>';
      return;
    }
    var html = "";
    var currentMonth = "";
    visible.forEach(function (r) {
      var ml = monthLabel(r.date);
      if (ml !== currentMonth) {
        currentMonth = ml;
        var count = visible.filter(function (v) { return monthLabel(v.date) === ml; }).length;
        html += '<div class="month"><h2>' + esc(ml) + '</h2><span class="count">' + count + "件</span></div>";
      }
      html +=
        '<article class="row' + (r.supersededBy ? " superseded" : "") + '">' +
          '<div class="row-date">' + esc(r.date) + "</div>" +
          '<div class="seal ' + sealClass(r.project) + '">' + esc(r.project) + "</div>" +
          '<div class="row-main">' +
            '<a class="title" href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.title) + "</a>" +
            (r.supersededBy ? '<span class="old-badge">旧版</span>' : "") +
            '<div class="row-meta">' +
              (r.filename ? '<span class="fname">' + esc(r.filename) + "</span>" : "") +
              (r.note ? "<span>" + esc(r.note) + "</span>" : "") +
            "</div>" +
          "</div>" +
          '<button type="button" class="row-copy" data-url="' + esc(r.url) + '">URLコピー</button>' +
        "</article>";
    });
    $list.innerHTML = html;
  }

  /* ---- copy ---- */
  $list.addEventListener("click", function (e) {
    var btn = e.target.closest(".row-copy");
    if (!btn) return;
    var url = btn.getAttribute("data-url");
    copyText(url).then(function (ok) {
      btn.textContent = ok ? "コピー済 ✓" : "コピー失敗";
      btn.classList.add("done");
      setTimeout(function () {
        btn.textContent = "URLコピー";
        btn.classList.remove("done");
      }, 1600);
    });
  });
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return fallbackCopy(text); });
    }
    return Promise.resolve(fallbackCopy(text));
  }
  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  /* ---- search / toggle ---- */
  $q.addEventListener("input", function () {
    state.q = $q.value.trim().toLowerCase();
    renderList();
  });
  $old.addEventListener("change", function () {
    state.showOld = $old.checked;
    renderList();
  });

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  renderStats();
  renderChips();
  renderList();
})();
</script>
</body>
</html>
